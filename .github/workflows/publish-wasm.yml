# Build and publish the @offbit-ai/reflow-wasm browser bundle.
#
# Triggers
# --------
# - Tag push matching `wasm-v*` (e.g. `wasm-v0.2.0`) → wasm-pack build,
#   then publish to npm.
# - Manual `workflow_dispatch` → build only (no publish).
#
# Why this exists
# ---------------
# `crates/reflow_rt_wasm` is the browser distribution of the Reflow
# runtime. wasm-pack compiles it to `wasm32-unknown-unknown` and emits
# a `.wasm` + JS-glue bundle that ships as an npm package. Apps can
# `import init, { Graph, GraphNetwork } from "@offbit-ai/reflow-wasm"`
# to get Reflow running in the browser.
#
# Publishing auth uses the npm classic `NPM_TOKEN` (same token as
# publish-node.yml). Trusted Publishing (OIDC) is not enabled for
# this package yet — flip after the first release lands.

name: publish-wasm

on:
  push:
    tags:
      - 'wasm-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build wasm bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.5

      - name: Install wasm-pack
        # The released wasm-pack binary is faster than `cargo install`
        # and avoids a cold compile on every CI run.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build with wasm-pack
        # `--scope offbit-ai` makes the generated package.json's name
        # `@offbit-ai/reflow_rt_wasm`. We rewrite it to
        # `@offbit-ai/reflow-wasm` (hyphenated, no rt-prefix) below
        # before publishing — npm convention prefers hyphens, and
        # `reflow-wasm` is the user-facing name.
        run: |
          wasm-pack build crates/reflow_rt_wasm \
            --target web \
            --release \
            --scope offbit-ai \
            --out-dir ../../sdk/wasm/pkg

      - name: Rewrite package name
        working-directory: sdk/wasm/pkg
        run: |
          # jq edit: rename, drop the auto-generated reflow_rt_wasm name.
          jq '.name = "@offbit-ai/reflow-wasm"
              | .description = "Browser-WASM build of the Reflow runtime — Graph + GraphNetwork via wasm-bindgen."
              | .keywords = ["reflow","actor","dag","wasm","wasm-bindgen","browser"]
              | .repository = "https://github.com/offbit-ai/reflow"
              | .homepage = "https://github.com/offbit-ai/reflow"' \
            package.json > package.json.tmp
          mv package.json.tmp package.json
          cat package.json

      - uses: actions/upload-artifact@v4
        with:
          name: reflow-wasm-pkg
          path: sdk/wasm/pkg/
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/wasm-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: reflow-wasm-pkg
          path: sdk/wasm/pkg

      - name: Publish to npm
        working-directory: sdk/wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--access public` is required for first publish under a
        # scoped name; npm rejects scoped packages without it.
        run: npm publish --access public

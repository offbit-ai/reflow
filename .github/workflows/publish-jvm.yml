# Build native libs for every supported triple, bundle them into the
# JVM SDK jar, sign with GPG, and publish to Maven Central via the
# Sonatype Central Portal.
#
# Triggers
# --------
# - Tag push matching `sdk/jvm/v*` (e.g. `sdk/jvm/v0.2.0`).
# - Manual `workflow_dispatch` for build verification (no upload).
#
# Required secrets — see sdk/jvm/PUBLISHING.md for one-time setup
#   SONATYPE_USERNAME    Central Portal user-token username
#   SONATYPE_PASSWORD    Central Portal user-token password
#   SIGNING_KEY_ID       Last 16 hex chars of the GPG key id
#   SIGNING_KEY          ASCII-armored secret key (full block)
#   SIGNING_PASSWORD     Passphrase for SIGNING_KEY

name: publish-jvm

on:
  push:
    tags:
      - 'sdk/jvm/v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: native / ${{ matrix.res }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            triple: aarch64-apple-darwin
            res: darwin-arm64
            libname: libreflow_rt_jvm.dylib
          - host: macos-14
            triple: x86_64-apple-darwin
            res: darwin-x86_64
            libname: libreflow_rt_jvm.dylib
          - host: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            res: linux-x86_64
            libname: libreflow_rt_jvm.so
          - host: ubuntu-latest
            triple: aarch64-unknown-linux-gnu
            res: linux-aarch64
            libname: libreflow_rt_jvm.so
            linker_pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          - host: windows-latest
            triple: x86_64-pc-windows-msvc
            res: windows-x86_64
            libname: reflow_rt_jvm.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: mozilla-actions/sccache-action@v0.0.5

      - name: Install aarch64 linux cross toolchain
        if: ${{ matrix.linker_pkg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker_pkg }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "CFLAGS_aarch64_unknown_linux_gnu=-march=armv8-a -D__ARM_ARCH=8" >> $GITHUB_ENV

      - name: Build libreflow_rt_jvm (release)
        shell: bash
        run: |
          set -eux
          cargo build --release --target "${{ matrix.triple }}" \
            --manifest-path sdk/jvm/src/native/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.res }}
          path: sdk/jvm/src/native/target/${{ matrix.triple }}/release/${{ matrix.libname }}
          if-no-files-found: error

  publish:
    name: publish to Maven Central
    needs: build-native
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdk/jvm/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No gradle wrapper checked in (sdk/jvm/gradlew). Install the
      # Gradle CLI directly via setup-gradle's `gradle-version` input
      # and invoke it as `gradle` below.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Download every triple's native lib
        uses: actions/download-artifact@v4
        with:
          path: sdk/jvm/native-artifacts
          pattern: native-*

      - name: Stage natives at src/main/resources/native/<res>/
        shell: bash
        run: |
          set -eux
          cd sdk/jvm
          for d in native-artifacts/native-*/; do
            res="$(basename "$d" | sed 's/^native-//')"
            mkdir -p "src/main/resources/native/$res"
            cp "$d"/* "src/main/resources/native/$res/"
          done
          ls -laR src/main/resources/native

      - name: Publish to Maven Central
        working-directory: sdk/jvm
        # No `signingInMemoryKeyId` — gradle's PGP plugin is strict
        # about the format (last 8 hex chars only) and the safer
        # path is to let it derive the id from the key block itself.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon --stacktrace publishAndReleaseToMavenCentral

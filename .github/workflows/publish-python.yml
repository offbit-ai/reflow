# Build and publish the offbit-reflow Python SDK wheels.
#
# Triggers
# --------
# - Tag push matching `python-v*` (e.g. `python-v0.2.0`) → build every
#   wheel triple, run tests, then upload to PyPI.
# - Manual `workflow_dispatch` → build + test only (no publish).
#
# Publishing auth
# ---------------
# Uses an API token stored as the `PYPI_API_TOKEN` secret. After the
# first publish lands, flip this to PyPI trusted publishing (OIDC) by
# setting the `pypi` environment + `id-token: write` permission below
# and removing the MATURIN_PYPI_TOKEN env.

name: publish-python

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          working-directory: sdk/python
          sccache: 'true'
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: sdk/python/dist

  macos:
    name: macos / ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          working-directory: sdk/python
          sccache: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: sdk/python/dist

  windows:
    name: windows / ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          working-directory: sdk/python
          sccache: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: sdk/python/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: sdk/python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: sdk/python/dist

  # Smoke-test the built wheel in a clean venv on the current runner so a
  # broken wheel never reaches PyPI. Only tests the native wheel for each
  # host's architecture — cross-built aarch64 wheels are validated only
  # via `twine check`.
  test:
    name: test / ${{ matrix.os }}
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install wheel + run tests
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --find-links dist 'offbit-reflow'
          python -m pytest -q sdk/python/tests

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, test]
    if: startsWith(github.ref, 'refs/tags/python-v')
    # Once PyPI trusted publishing is configured for this repo, remove
    # the PYPI_API_TOKEN path and add:
    #   permissions: { id-token: write }
    #   environment: { name: pypi, url: https://pypi.org/p/offbit-reflow }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify metadata
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

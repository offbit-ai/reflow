[package]
name = "reflow_rt_jvm"
version = "0.2.0"
edition = "2021"
description = "JNI bindings for the Reflow runtime."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "reflow_rt_jvm"
crate-type = ["cdylib"]

[dependencies]
reflow_rt = { version = "0.2.0", path = "../../../../crates/reflow_rt", default-features = false, features = ["components-core"] }
reflow_components = { version = "0.2.0", path = "../../../../crates/reflow_components", default-features = false, features = ["av-core"] }
jni = "0.21"
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
flume = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
once_cell = "1"

[profile.release]
lto = true
codegen-units = 1

<!doctype html>
<meta charset="utf-8">
<title>WebGPU SDF — Reflow tutorial 02</title>
<style>
  body { margin: 0; background: #0b1020; color: #c9d2e6; font: 14px system-ui; }
  canvas { display: block; }
  small { position: fixed; bottom: 8px; left: 12px; opacity: .6; }
  .err { position: fixed; top: 12px; left: 12px; background: #2a0e1a; padding: 8px 12px; border-radius: 4px; }
</style>
<canvas id="stage"></canvas>
<small>move your mouse to orbit the camera</small>

<script type="module">
import { ready, Network, Actor, Message, bindInputEvents }
  from "https://esm.sh/@offbit-ai/reflow";

await ready();

if (!navigator.gpu) {
  document.body.innerHTML = `<div class="err">WebGPU isn't available in this browser. Try Chrome 113+ or Safari Technology Preview.</div>`;
  throw new Error("no webgpu");
}

const canvas = document.getElementById("stage");
canvas.width = innerWidth;
canvas.height = innerHeight;

const adapter = await navigator.gpu.requestAdapter();
const device  = await adapter.requestDevice();
const ctx     = canvas.getContext("webgpu");
const format  = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({ device, format, alphaMode: "premultiplied" });

class Clock extends Actor {
  static inports = [];
  static outports = ["time"];
  constructor() { super(); this.t0 = performance.now(); }
  run(c) {
    c.send({ time: Message.float((performance.now() - this.t0) / 1000) });
    requestAnimationFrame(() => c.done());
  }
}

class MouseOrbit extends Actor {
  static inports = ["position"];
  static outports = ["camera"];
  constructor() {
    super();
    this.yaw = 0.6;
    this.pitch = 0.3;
  }
  run(c) {
    const p = c.input.position?.data;
    if (p) {
      this.yaw   = (p.x / innerWidth)  * Math.PI * 2;
      this.pitch = (p.y / innerHeight) * (Math.PI * 0.45) - (Math.PI * 0.1);
    }
    const r = 4.5;
    c.send({ camera: Message.object({
      x: r * Math.cos(this.pitch) * Math.cos(this.yaw),
      y: r * Math.sin(this.pitch),
      z: r * Math.cos(this.pitch) * Math.sin(this.yaw),
    }) });
    c.done();
  }
}

const SHADER = /* wgsl */ `
struct U { time: f32, camX: f32, camY: f32, camZ: f32, w: f32, h: f32, _pad0: f32, _pad1: f32, };
@group(0) @binding(0) var<uniform> u: U;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f,3>(vec2f(-1,-3), vec2f(-1,1), vec2f(3,1));
  return vec4f(p[i], 0.0, 1.0);
}

fn smin(a: f32, b: f32, k: f32) -> f32 {
  let h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}

fn opTwist(p: vec3f, k: f32) -> vec3f {
  let c = cos(k*p.y); let s = sin(k*p.y);
  return vec3f(c*p.x - s*p.z, p.y, s*p.x + c*p.z);
}

fn sdSphere(p: vec3f, r: f32) -> f32 { return length(p) - r; }
fn sdBox(p: vec3f, b: vec3f) -> f32 {
  let q = abs(p) - b;
  return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0);
}

fn scene(p_in: vec3f) -> f32 {
  let p = opTwist(p_in, 0.6 + 0.3*sin(u.time*0.4));
  let s = sdSphere(p - vec3f(0.6, 0.3, 0.0), 0.8);
  let b = sdBox(p,                            vec3f(0.55));
  return smin(s, b, 0.45);
}

fn normal(p: vec3f) -> vec3f {
  let e = vec2f(1.0, -1.0) * 0.0015;
  return normalize(
    e.xyy*scene(p + e.xyy) + e.yyx*scene(p + e.yyx) +
    e.yxy*scene(p + e.yxy) + e.xxx*scene(p + e.xxx));
}

@fragment fn fs(@builtin(position) frag: vec4f) -> @location(0) vec4f {
  let uv = (frag.xy / vec2f(u.w, u.h)) * 2.0 - 1.0;
  let aspect = u.w / u.h;
  let ro = vec3f(u.camX, u.camY, u.camZ);
  let f  = normalize(-ro);
  let r  = normalize(cross(vec3f(0,1,0), f));
  let up = cross(f, r);
  let rd = normalize(f + r*uv.x*aspect + up*-uv.y);

  var t = 0.0;
  var hit = false;
  var p = ro;
  for (var i = 0; i < 80; i = i + 1) {
    p = ro + rd*t;
    let d = scene(p);
    if (d < 0.001) { hit = true; break; }
    if (t > 30.0) { break; }
    t = t + d;
  }
  if (!hit) {
    let g = 0.05 + 0.05*rd.y;
    return vec4f(g, g + 0.02, g + 0.04, 1.0);
  }
  let n = normal(p);
  let l = normalize(vec3f(0.6, 0.8, 0.4));
  let diff = max(dot(n, l), 0.0);
  let rim  = pow(1.0 - max(dot(n, -rd), 0.0), 2.0);
  let col  = vec3f(0.47, 0.76, 1.0)*diff + vec3f(0.2, 0.4, 0.8)*rim + 0.05;
  return vec4f(pow(col, vec3f(0.4545)), 1.0);
}`;

class SdfRender extends Actor {
  static inports = ["time", "camera"];
  static outports = [];

  constructor(device, ctx, format, canvas) {
    super();
    this.device = device;
    this.ctx = ctx;
    this.canvas = canvas;
    const module = device.createShaderModule({ code: SHADER });
    this.pipeline = device.createRenderPipeline({
      layout: "auto",
      vertex:   { module, entryPoint: "vs" },
      fragment: { module, entryPoint: "fs", targets: [{ format }] },
      primitive:{ topology: "triangle-list" },
    });
    this.uniformBuf = device.createBuffer({
      size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    this.bindGroup = device.createBindGroup({
      layout: this.pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: this.uniformBuf } }],
    });
    this.uniforms = new Float32Array(8);
  }

  run(c) {
    const t = c.input.time?.data ?? 0;
    const cam = c.input.camera?.data ?? { x: 3, y: 2, z: 4 };
    this.uniforms.set([t, cam.x, cam.y, cam.z, this.canvas.width, this.canvas.height, 0, 0]);
    this.device.queue.writeBuffer(this.uniformBuf, 0, this.uniforms);

    const enc = this.device.createCommandEncoder();
    const pass = enc.beginRenderPass({
      colorAttachments: [{
        view: this.ctx.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 1 },
        loadOp: "clear", storeOp: "store",
      }],
    });
    pass.setPipeline(this.pipeline);
    pass.setBindGroup(0, this.bindGroup);
    pass.draw(3);
    pass.end();
    this.device.queue.submit([enc.finish()]);
    c.done();
  }
}

const net = new Network();
net.addNode("clock",  "tpl_clock");
net.addNode("mouse",  "tpl_mouse_input");
net.addNode("orbit",  "tpl_mouse_orbit");
net.addNode("render", "tpl_sdf_render");

net.addConnection("clock", "time",     "render", "time");
net.addConnection("mouse", "position", "orbit",  "position");
net.addConnection("orbit", "camera",   "render", "camera");

net.registerActor("tpl_clock",        new Clock());
net.registerActor("tpl_mouse_orbit",  new MouseOrbit());
net.registerActor("tpl_sdf_render",   new SdfRender(device, ctx, format, canvas));

bindInputEvents(net, document.body);
await net.start();
</script>

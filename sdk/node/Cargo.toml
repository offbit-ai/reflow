[package]
name = "reflow_rt_node"
version = "0.2.3"
edition = "2021"
authors = ["Damilare Akinlaja"]
description = "Node.js bindings for the Reflow runtime (napi-rs)."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reflow_rt = { version = "0.2.0", path = "../../crates/reflow_rt", default-features = false, features = ["components-core"] }
reflow_components = { version = "0.2.0", path = "../../crates/reflow_components", default-features = false, features = ["av-core"] }
napi = { version = "2", default-features = false, features = ["napi9", "async", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
flume = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
once_cell = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1

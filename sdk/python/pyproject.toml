[build-system]
requires = ["maturin>=1.0,<2"]
build-backend = "maturin"

[project]
name = "offbit-reflow"
version = "0.2.5"
description = "Reflow is a modular flow-based programming runtime that executes actor-model DAGs for data pipelines, real-time media, visual tooling, and optional ML/CV workloads. This package is the official Python SDK."
authors = [{ name = "Offbit AI" }]
readme = "README.md"
# PEP 621: a plain string is interpreted as an SPDX expression and
# emitted as `License-Expression:` under Metadata-Version 2.4. Use the
# table form to force the legacy `License:` header, which every twine
# and pip release accepts.
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/offbit-ai/reflow"
Repository = "https://github.com/offbit-ai/reflow"
Documentation = "https://github.com/offbit-ai/reflow/tree/main/docs"

[tool.maturin]
python-source = "."
module-name = "offbit_reflow._native"
features = ["pyo3/extension-module"]

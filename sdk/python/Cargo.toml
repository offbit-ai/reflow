[package]
name = "reflow_rt_py"
version = "0.2.4"
edition = "2021"
authors = ["Damilare Akinlaja"]
description = "Python bindings for the Reflow runtime (pyo3)."
# MIT (instead of "MIT OR Apache-2.0") so maturin emits the classic
# `License:` metadata field. twine still flags the PEP 639
# `license-expression` form on some versions — stick with the
# widely-understood format for published wheels.
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
reflow_rt = { version = "0.2.0", path = "../../crates/reflow_rt", default-features = false, features = ["components-core"] }
reflow_components = { version = "0.2.0", path = "../../crates/reflow_components", default-features = false, features = ["av-core"] }
# abi3-py39 produces a single wheel per platform that works on any
# CPython 3.9+ rather than needing a separate build per interpreter.
# Forward-compatibility lets us build against newer Pythons (e.g. 3.14
# on homebrew) without waiting for a pyo3 release bump.
pyo3 = { version = "0.22", features = ["extension-module", "anyhow", "abi3-py39"] }
pythonize = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
flume = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
once_cell = "1"

[profile.release]
lto = true
codegen-units = 1

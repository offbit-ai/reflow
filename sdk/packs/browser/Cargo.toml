[package]
name = "reflow_pack_browser"
version = "0.2.0"
edition = "2024"
authors = ["Damilare Akinlaja"]
description = "Reflow actor pack — browser automation (chromiumoxide). Publishes `tpl_browser_screencast`."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
rust-version = "1.85"
keywords = ["reflow", "actor", "pack", "browser", "chromium"]
categories = ["development-tools", "concurrency"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reflow_pack_sdk = { version = "0.2.1", path = "../../../crates/reflow_pack_sdk" }
reflow_components = { version = "0.2.1", path = "../../../crates/reflow_components", default-features = false, features = ["browser"] }

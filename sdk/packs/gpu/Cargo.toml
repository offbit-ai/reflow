[package]
name = "reflow_pack_gpu"
version = "0.2.0"
edition = "2024"
authors = ["Damilare Akinlaja"]
description = "Reflow actor pack — wgpu-backed SDF / scene / 2D renderers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
readme = "README.md"
rust-version = "1.85"
keywords = ["reflow", "actor", "pack", "gpu", "wgpu"]
categories = ["development-tools", "rendering"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reflow_pack_sdk = { version = "0.2.0", path = "../../../crates/reflow_pack_sdk" }
reflow_components = { version = "0.2.0", path = "../../../crates/reflow_components", default-features = false, features = ["gpu"] }

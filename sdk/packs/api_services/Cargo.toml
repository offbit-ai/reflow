[package]
name = "reflow_pack_api_services"
version = "0.2.0"
edition = "2024"
authors = ["Damilare Akinlaja"]
description = "Reflow actor pack — 6,700+ generated API-service actors (Slack, Stripe, Jira, Notion, …)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
readme = "README.md"
rust-version = "1.85"
keywords = ["reflow", "actor", "pack", "api", "services"]
categories = ["development-tools", "api-bindings"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reflow_pack_sdk = { version = "0.2.0", path = "../../../crates/reflow_pack_sdk" }
# `api_services` is the underscore-named reflow_components feature.
# Also pulls in `av-core` defaults so the registry compiles cleanly.
reflow_components = { version = "0.2.0", path = "../../../crates/reflow_components", default-features = false, features = ["api_services"] }

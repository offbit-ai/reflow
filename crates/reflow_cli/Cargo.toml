[package]
name = "reflow_cli"
version = "0.2.0"
edition = "2024"
authors = ["Damilare Akinlaja"]
description = "The unified `reflow` command-line tool — run graphs, manage multi-graph workspaces, spawn distributed peers, and drive tracing."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
rust-version = "1.85"

[[bin]]
name = "reflow"
path = "src/main.rs"

[dependencies]
# Runtime umbrella: network, graph, bundled component catalog, pack loader.
reflow_rt = { path = "../reflow_rt" }
# Distributed peer + discovery server.
reflow_distributed = { path = "../reflow_distributed" }
# Tracing collector (lib surface) + client.
reflow_tracing = { path = "../reflow_tracing" }
reflow_tracing_protocol = { path = "../reflow_tracing_protocol" }
# HTTP server core, linked in-process. Zeal is omitted (default-features = false)
# so the out-of-tree zeal-sdk isn't pulled in.
reflow_server = { path = "../reflow_server", default-features = false }

clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flume = "0.11"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }


[package]
name = "reflow_sdf"
version = "0.2.0"
edition = "2021"
description = "SDF IR, primitives, operations, and WGSL code generation for Reflow procedural rendering."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_sdf"
readme = "README.md"
authors = ["Damilare Akinlaja"]
rust-version = "1.85"
keywords = ["reflow", "sdf", "wgsl", "procedural", "rendering"]
categories = ["rendering", "graphics", "game-development"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

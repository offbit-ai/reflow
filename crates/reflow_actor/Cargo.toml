[package]
name = "reflow_actor"
version = "0.2.0"
edition = "2024"
authors = ["Damilare Akinlaja"]
description = "Actor trait, message types, ports, state, and stream handles for the Reflow runtime."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_actor"
readme = "README.md"
rust-version = "1.85"
keywords = ["reflow", "actor", "dag", "workflow", "concurrency"]
categories = ["concurrency", "development-tools", "wasm"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = {workspace = true}
reflow_graph = { version = "0.2.0", path = "../reflow_graph" }
reflow_actor_macro = { version = "0.2.0", path = "../reflow_actor_macro" }
reflow_tracing_protocol = { version = "0.2.0", path = "../reflow_tracing_protocol" }
parking_lot = {workspace = true}
flate2 = "1.0.35"
flume = {workspace = true}
futures = { version = "0.3" }
chrono = { version = "0.4", features = ["serde"] }
bitcode = { version = "0.6.4", features = ["serde"] }
ordered-float = "5.0.0"
once_cell = "1.19.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
zstd = "0.13.2"
rayon = "1.10.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.86"}
lz4_flex = "0.11.3"
gloo-utils = "0.2"
gloo-events = "0.2"
web-sys = { version = "0.3.77", features = [
    "console",
    "IdbRequest",
    "IdbVersionChangeEvent",
    "IdbFactory",
    "Window",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbOpenDbRequest",
    "DomException",
    "Storage",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
] }
tsify = { version = "0.4.5", features = ["js"] }
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3.77"
wasm-bindgen-test = "0.3.50"
console_error_panic_hook = "0.1.7"
serde-wasm-bindgen = "0.6.5"

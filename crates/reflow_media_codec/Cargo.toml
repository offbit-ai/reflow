[package]
name = "reflow_media_codec"
version = "0.2.0"
edition = "2021"
description = "Media codec boundary shared by Reflow media and ML actors."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_media_codec"
readme = "README.md"
authors = ["Damilare Akinlaja"]
rust-version = "1.85"
keywords = ["reflow", "codec", "media", "video", "audio"]
categories = ["multimedia", "multimedia::video", "multimedia::audio"]

[dependencies]
anyhow = { workspace = true }
reflow_actor = { version = "0.2.0", path = "../reflow_actor" }
reflow_media_types = { version = "0.2.0", path = "../reflow_media_types" }
serde = { workspace = true }
serde_json = { workspace = true }

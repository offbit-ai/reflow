[package]
name = "reflow_server"
version = "0.1.0"
edition = "2024"
authors = ["Damilare Akinlaja"]

[[bin]]
name = "reflow_server"
path = "src/main.rs"

[features]
default = ["zeal"]
# Zeal IDE integration (ZIP session, trace submission, workflow conversion).
# Pulls in the out-of-tree `zeal-sdk`; turn off (`default-features = false`) to
# build the server core without it — e.g. when linked into the `reflow` CLI.
zeal = ["dep:zeal-sdk"]
api_services = ["dep:reflow_api_services"]
gpu = ["reflow_components/gpu"]

[dependencies]
reflow_network = { path = "../reflow_network" }
reflow_graph = { path = "../reflow_graph" }
reflow_components = { path = "../reflow_components", default-features = false }
reflow_api_services = { path = "../reflow_api_services", optional = true }
reflow_actor_macro = { path = "../reflow_actor_macro" }
zeal-sdk = { path = "../../../zeal/packages/zeal-rust-sdk", optional = true }
# Concrete versions (not `workspace = true`): reflow_server is excluded from the
# workspace, so it must resolve standalone when linked as a path dep (e.g. by the
# `reflow` CLI). Keep these in step with the workspace root's versions.
serde = { version = "1.0.215", features = ["derive", "rc"] }
serde_json = "1.0.133"
anyhow = "1.0.94"
dashmap = "6.1.0"
tokio = { version = "1.32", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
futures = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
flume = "0.11"
log = "0.4"
env_logger = "0.11"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

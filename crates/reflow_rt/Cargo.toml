[package]
name = "reflow_rt"
version = "0.2.1"
edition = "2024"
authors = ["Damilare Akinlaja"]
description = "The public Rust runtime crate for building and running Reflow graph workflows."
documentation = "https://docs.rs/reflow_rt"
homepage = "https://github.com/offbit-ai/reflow"
keywords = ["workflow", "actor", "dag", "runtime", "media"]
categories = ["concurrency", "development-tools", "wasm"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/offbit-ai/reflow"
rust-version = "1.85"

[dependencies]
reflow_actor_macro = { version = "0.2.1", path = "../reflow_actor_macro" }
reflow_actor = { version = "0.2.1", path = "../reflow_actor" }
reflow_assets = { version = "0.2.1", path = "../reflow_assets" }
reflow_components = { version = "0.2.1", path = "../reflow_components", default-features = false }
reflow_graph = { version = "0.2.1", path = "../reflow_graph" }
reflow_network = { version = "0.2.1", path = "../reflow_network" }
reflow_pack_loader = { version = "0.2.1", path = "../reflow_pack_loader" }
reflow_pixel = { version = "0.2.1", path = "../reflow_pixel" }
reflow_sdf = { version = "0.2.1", path = "../reflow_sdf" }
reflow_shader = { version = "0.2.1", path = "../reflow_shader" }
reflow_vector = { version = "0.2.1", path = "../reflow_vector" }

reflow_api_services = { version = "0.2.1", path = "../reflow_api_services", optional = true }
reflow_asset_registry = { version = "0.2.1", path = "../reflow_asset_registry", optional = true }
reflow_cv_ops = { version = "0.2.1", path = "../reflow_cv_ops", optional = true }
reflow_dsp = { version = "0.2.1", path = "../reflow_dsp", optional = true }
reflow_litert = { version = "0.2.1", path = "../reflow_litert", optional = true }
reflow_media_codec = { version = "0.2.1", path = "../reflow_media_codec", optional = true }
reflow_media_types = { version = "0.2.1", path = "../reflow_media_types", optional = true }
reflow_ml_ops = { version = "0.2.1", path = "../reflow_ml_ops", optional = true }
reflow_taskpacks = { version = "0.2.1", path = "../reflow_taskpacks", optional = true }

[features]
default = ["components-core"]
components-core = []
components-default = ["av-core", "gpu", "window-events"]

api-services = ["dep:reflow_api_services", "reflow_components/api_services"]
api_services = ["api-services"]
av-core = ["dep:reflow_dsp", "reflow_components/av-core"]
browser = ["reflow_components/browser"]
browser-events = ["reflow_components/browser-events"]
camera-native = ["reflow_components/camera-native"]
gpu = ["reflow_components/gpu"]
media = ["dep:reflow_media_codec", "dep:reflow_media_types"]
ml = [
    "media",
    "dep:reflow_asset_registry",
    "dep:reflow_cv_ops",
    "dep:reflow_litert",
    "dep:reflow_ml_ops",
    "dep:reflow_taskpacks",
    "reflow_components/ml",
]
video-encode = ["reflow_components/video-encode"]
window-events = ["reflow_components/window-events"]

external-litert = ["ml", "reflow_litert/external-litert", "reflow_ml_ops/external-litert"]
full = [
    "api-services",
    "av-core",
    "browser-events",
    "camera-native",
    "components-default",
    "gpu",
    "ml",
    "video-encode",
    "window-events",
]
network-flowtrace = ["reflow_network/flowtrace"]
network-wasm = ["reflow_network/wasm"]

[package.metadata.docs.rs]
features = ["media", "ml"]
rustdoc-args = ["--cfg", "docsrs"]

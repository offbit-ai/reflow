[package]
name = "reflow_rt_capi"
version = "0.2.1"
edition = "2021"
authors = ["Damilare Akinlaja"]
description = "C ABI bindings for the Reflow runtime — the shared native surface consumed by Go (cgo), Kotlin/Java (JNI), and other non-Rust callers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_rt_capi"
readme = "README.md"
rust-version = "1.85"
keywords = ["reflow", "ffi", "c-api", "actor", "dag"]
categories = ["external-ffi-bindings", "concurrency", "development-tools"]

[lib]
name = "reflow_rt_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
reflow_rt = { version = "0.2.1", path = "../reflow_rt" }
reflow_pack_loader = { version = "0.2.1", path = "../reflow_pack_loader" }
reflow_components = { version = "0.2.1", path = "../reflow_components", default-features = false, optional = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
flume = { workspace = true }
parking_lot = { workspace = true }
once_cell = "1"
libc = "0.2"

[build-dependencies]
cbindgen = { version = "0.27", optional = true }

[features]
default = ["components"]
# Ship the reflow_components standard actor catalog so SDKs can instantiate
# bundled templates by name and embed subgraphs without the caller supplying
# an actor map. Turn off for a thinner shared library.
components = ["dep:reflow_components"]
# Regenerate the C header on build. Off by default so CI builds don't need cbindgen.
generate-header = ["dep:cbindgen"]

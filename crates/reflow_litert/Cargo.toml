[package]
name = "reflow_litert"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
# Optional Offbit LiteRT bindings from crates.io.
litert = { version = "0.2.1", optional = true }
litert-sys = { version = "0.2.1", optional = true }
reflow_media_types = { path = "../reflow_media_types" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
external-litert = ["dep:litert", "dep:litert-sys"]

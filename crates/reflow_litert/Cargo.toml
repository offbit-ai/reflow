[package]
name = "reflow_litert"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
# Optional Offbit LiteRT bindings. Kept as a git dependency so downstream
# builds do not rely on a sibling checkout being present.
litert = { git = "https://github.com/offbit-ai/LiteRT", package = "litert", optional = true }
litert-sys = { git = "https://github.com/offbit-ai/LiteRT", package = "litert-sys", optional = true }
reflow_media_types = { path = "../reflow_media_types" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
external-litert = ["dep:litert", "dep:litert-sys"]

[package]
name = "reflow_ml_ops"
version = "0.2.1"
edition = "2021"
description = "ML inference and decode actors for Reflow, using reflow_litert as the backend boundary."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_ml_ops"
readme = "README.md"
authors = ["Damilare Akinlaja"]
rust-version = "1.85"
keywords = ["reflow", "ml", "inference", "detection", "landmarks"]
categories = ["science", "multimedia"]

[dependencies]
reflow_actor_macro = { version = "0.2.1", path = "../reflow_actor_macro" }
anyhow = { workspace = true }
flume = { workspace = true }
reflow_actor = { version = "0.2.1", path = "../reflow_actor" }
reflow_asset_registry = { version = "0.2.1", path = "../reflow_asset_registry" }
reflow_litert = { version = "0.2.1", path = "../reflow_litert" }
reflow_media_codec = { version = "0.2.1", path = "../reflow_media_codec" }
reflow_media_types = { version = "0.2.1", path = "../reflow_media_types" }
serde_json = { workspace = true }

[dev-dependencies]
parking_lot = "0.12.3"
tempfile = "3.21.0"
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
external-litert = ["reflow_litert/external-litert"]

[package]
name = "reflow_distributed"
version = "0.1.0"
edition = "2024"
description = "Discovery server + peer CLI for Reflow's distributed network"
license = "MIT OR Apache-2.0"

[dependencies]
reflow_network = { path = "../reflow_network" }
reflow_actor = { path = "../reflow_actor" }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { version = "0.4.41", features = ["serde"] }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8.23"
axum = "0.7"
futures = "0.3"
flume = { workspace = true }

[[bin]]
name = "reflow-discovery"
path = "src/bin/reflow_discovery.rs"

[[bin]]
name = "reflow-peer"
path = "src/bin/reflow_peer.rs"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

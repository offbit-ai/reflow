# cargo-features = ["edition2024"]

[package]
name = "reflow_actor_macro"
version = "0.2.1"
edition = "2024"
authors = ["Damilare Akinlaja"]
description = "Procedural macros for declaring Reflow actors."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_actor_macro"
readme = "README.md"
rust-version = "1.85"
keywords = ["reflow", "actor", "dag", "macro", "workflow"]
categories = ["development-tools", "concurrency"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "derive"] }
quote = "1.0"
proc-macro2 = "1.0"

[package]
name = "reflow_components"
version = "0.1.0"
edition = "2021"

[dependencies]
reflow_actor = { path = "../reflow_actor" }
reflow_graph = { path = "../reflow_graph" }
reflow_tracing_protocol = { path = "../reflow_tracing_protocol" }
actor_macro = { path = "../actor_macro" }

# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }

# HTTP/Network
reqwest = { version = "0.12", features = ["json", "stream"] }

# File operations
tokio = { version = "1", features = ["fs", "io-util"] }

# Data processing
chrono = { version = "0.4", features = ["serde"] }

# JavaScript runtime
rquickjs = { version = "0.6", features = ["array-buffer", "bindgen", "classes", "futures", "loader", "macro", "parallel", "properties"] }

# AV processing (pure-Rust, Wasm-safe)
reflow_dsp = { path = "../reflow_dsp", optional = true }
reflow_pixel = { path = "../reflow_pixel" }

# Image codecs (PNG, JPEG, WebP, GIF — pure Rust, Wasm-safe)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"

# SDF / Noise (pure Rust, Wasm-safe — always available)
reflow_sdf = { path = "../reflow_sdf" }

# API actors (optional — large, 88 services / ~6700 actors)
reflow_api = { path = "../reflow_api", optional = true }

# Asset database (pure Rust, Wasm-safe)
reflow_assets = { path = "../reflow_assets" }

# GPU compute (wgpu — optional, native-only)
once_cell = { version = "1", optional = true }
wgpu = { version = "24", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

# Video encoding (optional, native-only)
openh264 = { version = "0.6", optional = true }

# Headless browser automation (optional, native-only)
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], optional = true }

# 3D model import (pure Rust, Wasm-safe)
gltf = "1"
tobj = "4"
fbxcel = "0.9"

# Shader graph (node-based materials → WGSL codegen)
reflow_shader = { path = "../reflow_shader" }

# Physics (pure Rust, Wasm-safe)
rapier3d = { version = "0.22", features = ["serde-serialize"] }

# Font rasterization (pure Rust, Wasm-safe)
fontdue = "0.9"

# 2D vector rasterization (pure Rust, Wasm-safe)
tiny-skia = "0.11"
reflow_vector = { path = "../reflow_vector" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

[features]
default = ["av-core", "gpu", "window-events"]
api = ["dep:reflow_api"]
av-core = ["dep:reflow_dsp"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:once_cell"]
video-encode = ["dep:openh264"]
browser = ["dep:chromiumoxide"]
window-events = []
browser-events = ["window-events"]

[dev-dependencies]
reflow_server = { path = "../reflow_server" }

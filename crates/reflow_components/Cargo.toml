[package]
name = "reflow_components"
version = "0.2.0"
edition = "2021"
description = "Standard component catalog for Reflow — procedural, media, GPU, animation, I/O, and stream actors."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_components"
readme = "README.md"
authors = ["Damilare Akinlaja"]
rust-version = "1.85"
keywords = ["reflow", "actor", "dag", "gpu", "workflow"]
categories = ["multimedia", "rendering", "development-tools"]

[dependencies]
reflow_actor = { version = "0.2.0", path = "../reflow_actor" }
reflow_graph = { version = "0.2.0", path = "../reflow_graph" }
reflow_network = { version = "0.2.0", path = "../reflow_network" }
reflow_tracing_protocol = { version = "0.2.0", path = "../reflow_tracing_protocol" }
reflow_actor_macro = { version = "0.2.0", path = "../reflow_actor_macro" }

# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }

# HTTP/Network
reqwest = { version = "0.12", features = ["json", "stream"] }

# File operations and async stream source tasks
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }

# Data processing
chrono = { version = "0.4", features = ["serde"] }

# JavaScript runtime
rquickjs = { version = "0.6", features = ["array-buffer", "bindgen", "classes", "futures", "loader", "macro", "parallel", "properties"] }

# AV processing (pure-Rust, Wasm-safe)
reflow_dsp = { version = "0.2.0", path = "../reflow_dsp", optional = true }
reflow_pixel = { version = "0.2.0", path = "../reflow_pixel" }

# Image codecs (PNG, JPEG, WebP, GIF — pure Rust, Wasm-safe)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"

# SDF / Noise (pure Rust, Wasm-safe — always available)
reflow_sdf = { version = "0.2.0", path = "../reflow_sdf" }

# API actors (optional — large, 88 services / ~6700 actors)
reflow_api_services = { version = "0.2.0", path = "../reflow_api_services", optional = true }

# Asset database (pure Rust, Wasm-safe)
reflow_assets = { version = "0.2.0", path = "../reflow_assets" }

# Media / ML stack (optional; mock-first, no native LiteRT dependency by default)
reflow_cv_ops = { version = "0.2.0", path = "../reflow_cv_ops", optional = true }
reflow_ml_ops = { version = "0.2.0", path = "../reflow_ml_ops", optional = true }
reflow_taskpacks = { version = "0.2.0", path = "../reflow_taskpacks", optional = true }

# Zero-cost byte↔float reinterpretation (always available for skinning SIMD)
bytemuck = { version = "1.14", features = ["derive"] }

# GPU compute (wgpu — optional, native-only)
once_cell = { version = "1", optional = true }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }

# Video encoding (optional, native-only)
openh264 = { version = "0.6", optional = true }

# Headless browser automation (optional, native-only)
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], optional = true }

# 3D model import (pure Rust, Wasm-safe)
gltf = "1"
tobj = "4"
fbxcel = "0.9"

# Shader graph (node-based materials → WGSL codegen)
reflow_shader = { version = "0.2.0", path = "../reflow_shader" }

# Physics (pure Rust, Wasm-safe)
rapier3d = { version = "0.22", features = ["serde-serialize"] }

# Font rasterization (pure Rust, Wasm-safe)
fontdue = "0.9"

# 2D vector rasterization (pure Rust, Wasm-safe)
tiny-skia = "0.11"
reflow_vector = { version = "0.2.0", path = "../reflow_vector" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }
nokhwa = { version = "0.10.10", features = ["js-sys"], optional = true }

[features]
default = ["av-core", "gpu", "window-events"]
api_services = ["dep:reflow_api_services"]
av-core = ["dep:reflow_dsp"]
gpu = ["dep:wgpu", "dep:pollster", "dep:once_cell"]
video-encode = ["dep:openh264"]
browser = ["dep:chromiumoxide"]
window-events = []
browser-events = ["window-events"]
ml = ["dep:reflow_cv_ops", "dep:reflow_ml_ops", "dep:reflow_taskpacks"]
camera-native = ["dep:nokhwa"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native camera capture (optional; Linux V4L2, macOS AVFoundation, Windows MSMF via nokhwa)
nokhwa = { version = "0.10.10", features = ["input-native"], optional = true }




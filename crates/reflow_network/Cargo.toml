# cargo-features = ["edition2024"]

[package]
name = "reflow_network"
version = "0.2.1"
edition = "2024"
authors = ["Damilare Akinlaja"]
description = "Network executor for Reflow — routes messages between actors, manages subgraphs, and emits runtime events."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_network"
readme = "README.md"
rust-version = "1.85"
keywords = ["reflow", "actor", "dag", "workflow", "concurrency"]
categories = ["concurrency", "development-tools", "wasm"]

[lib]
crate-type = ["cdylib", 'rlib']
path = "src/lib.rs"
doctest = false

[dependencies]
reflow_tracing_protocol = { version = "0.2.1", path = "../reflow_tracing_protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = {workspace = true}
reflow_graph = { version = "0.2.1", path = "../reflow_graph" }
reflow_actor = { version = "0.2.1", path = "../reflow_actor" }
reflow_actor_macro = { version = "0.2.1", path = "../reflow_actor_macro" }
parking_lot = {workspace = true}
flate2 = "1.0.35"
flume = {workspace = true}
rusty_pool = "0.7.0"
num_cpus = "1.16.0"
once_cell = "1.19.0"
tween = "2.0.2"
glob = "0.3.2"
tempfile = "3.21.0"

futures-util = "0.3.31"

foreach = "0.3.0"
undo = "0.52.0"
futures = { version = "0.3" }
bitcode = { version = "0.6.4", features = ["serde"] }
ordered-float = "5.0.0"

chrono = { version = "0.4", features = ["serde"] }
serde_with = { version = "2.1" , default-features = false, features = ["alloc", "std"]}
tracing ={ workspace = true}
async-trait = "0.1.88"
reqwest = {version = "0.12.20", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde_yaml = "0.9.30"
lazy_static = "1.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
zstd = "0.13.2"
rayon = "1.10.0"
reqwest = {version = "0.12.20", default-features = false, features = ["json", "rustls-tls"]}
tokio-tungstenite = "0.27.0"
uuid = {workspace = true, features = ["v4"]}
hostname = "0.4.1"
semver = "1.0.26"
sha2 = "0.10.9"
prometheus = "0.14.0"
lz4_flex = "0.11.3"
brotli = "7.0.0"

# Script actor dependencies
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
tungstenite = "0.20"
memmap2 = "0.9"
shared_memory = "0.12"
base64 = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.86"}
lz4_flex = "0.11.3"
gloo-utils = "0.2"
gloo-events = "0.2"
web-sys = { version = "0.3.77", features = [
    "console",
    "IdbRequest",
    "IdbVersionChangeEvent",
    "IdbFactory",
    "Window",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbOpenDbRequest",
    "DomException",
    "Storage",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    # input_events.rs uses these to read DOM input events from JS.
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "EventTarget",
    "Event",
] }
tsify = { version = "0.4.5", features = ["js"] }
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3.77"
wasm-bindgen-test = "0.3.50"
console_error_panic_hook = "0.1.7"
serde-wasm-bindgen = "0.6.5"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[features]
flowtrace = []
default = []
wasm = []



[dev-dependencies]
wasm-bindgen-test = "0.3.50"
tracing-subscriber = "0.3"

[[example]]
name = "distributed_example"
path = "example/distributed_example.rs"


[package.metadata.wasm-pack.profile.release]
wasm-opt = false

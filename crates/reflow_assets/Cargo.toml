[package]
name = "reflow_assets"
version = "0.1.0"
edition = "2021"
description = "Content-addressed asset database for Reflow workflows"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbObjectStoreParameters",
    "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode",
    "IdbVersionChangeEvent", "Window",
] }

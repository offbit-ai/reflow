[package]
name = "reflow_assets"
version = "0.2.0"
edition = "2021"
description = "Content-addressed asset database conventions for Reflow workflows."
license = "MIT OR Apache-2.0"
repository = "https://github.com/offbit-ai/reflow"
homepage = "https://github.com/offbit-ai/reflow"
documentation = "https://docs.rs/reflow_assets"
readme = "README.md"
authors = ["Damilare Akinlaja"]
rust-version = "1.85"
keywords = ["reflow", "assets", "content-addressed", "blake3", "workflow"]
categories = ["data-structures", "caching", "wasm"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# LZ4 compression — pure Rust, wasm-safe, fastest decompress (~4 GB/s)
lz4_flex = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbObjectStoreParameters",
    "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode",
    "IdbVersionChangeEvent", "Window",
] }

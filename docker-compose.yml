version: '3.8'

services:
  # Redis for actor state management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - reflow-network


networks:
  reflow-network:
    driver: bridge

volumes:
  redis-data:
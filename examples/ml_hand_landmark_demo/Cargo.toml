[workspace]

[package]
name = "ml_hand_landmark_demo"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
actor_macro = { path = "../../crates/actor_macro" }
flume = "0.11"
litert = "0.2.1"
litert-sys = "0.2.1"
reflow_asset_registry = { path = "../../crates/reflow_asset_registry" }
reflow_litert = { path = "../../crates/reflow_litert", features = ["external-litert"] }
reflow_media_codec = { path = "../../crates/reflow_media_codec" }
reflow_media_types = { path = "../../crates/reflow_media_types" }
reflow_ml_ops = { path = "../../crates/reflow_ml_ops", features = ["external-litert"] }
reflow_network = { path = "../../crates/reflow_network" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

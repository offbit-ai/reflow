[workspace]

[package]
name = "melting_ice"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "melting_ice"
path = "main.rs"

[dependencies]
reflow_network = { path = "../../crates/reflow_network" }
reflow_components = { path = "../../crates/reflow_components", default-features = false, features = ["gpu", "video-encode"] }
reflow_shader = { path = "../../crates/reflow_shader" }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"

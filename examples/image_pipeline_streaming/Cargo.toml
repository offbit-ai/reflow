[workspace]

[package]
name = "image_pipeline_streaming"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "image_pipeline"
path = "main.rs"

[dependencies]
reflow_network = { path = "../../crates/reflow_network" }
reflow_actor = { path = "../../crates/reflow_actor" }
reflow_actor_macro = { path = "../../crates/reflow_actor_macro" }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
parking_lot = "0.12"
flume = "0.11"
futures = "0.3"

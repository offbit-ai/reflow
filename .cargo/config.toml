[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
# getrandom 0.3 needs a backend cfg for browser; without it the wasm32
# build fails at link time on a `compile_error!`.
#
# `web_sys_unstable_apis` opts in to web-sys bindings for browser
# APIs that haven't been merged into the stable WHATWG/W3C surface
# yet — currently WebCodecs (VideoEncoder, VideoFrame, …), used by
# the wasm video_encode fallback. Stable APIs are unaffected.
rustflags = [
    '--cfg', 'getrandom_backend="wasm_js"',
    '--cfg', 'web_sys_unstable_apis',
]

[build]
# Enable incremental compilation
incremental = false
# Configure the number of parallel jobs
jobs = 8

# Deliberately no global `rustc-wrapper = "sccache"`: that breaks any
# environment that hasn't installed sccache (e.g. the sdist step of
# our Python publish workflow). If you want sccache locally, either
# set `CARGO_BUILD_RUSTC_WRAPPER=sccache` in your shell, or add a
# `~/.cargo/config.toml` override outside this repository.


[target.'cfg(all())']
# Suppress compiler warnings.
#
# Deliberately no `-C target-cpu=native` here: it breaks portable
# release builds (CI runners can crash rustc with SIGILL when sccache
# replays wrapped commands, and shipped artifacts must stay compatible
# with every target CPU). Set RUSTFLAGS in your shell if you want
# native-cpu tuning for local dev.
rustflags = ["-A", "warnings"]

# macOS specific configuration
# Note: custom LLVM linker removed due to version mismatch between lld/llvm homebrew packages.
# Using default Apple toolchain linker instead.
[target.aarch64-apple-darwin]

# Profile-specific optimization settings
[profile.dev]
opt-level = 0            # Basic optimizations without slowing compilation too much
debug = true             # Full debug info
debug-assertions = true  # Enable debug assertions
overflow-checks = true   # Enable integer overflow checks

[profile.release]
opt-level = 3            # Maximum optimization
debug = false            # No debug info
lto = "thin"             # Enable Link Time Optimization (thin mode is faster)
codegen-units = 1        # Maximize optimization by using a single codegen unit
panic = "abort"          # Abort on panic for smaller binary size
strip = true             # Strip symbols from binary

[cargo-new]
name = "Damilare Akinlaja"
email = "damilare@zenturi.co"

[registries.crates-io]
protocol = "sparse"

[net]
git-fetch-with-cli = true